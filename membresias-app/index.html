<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plataforma de Membresías – Credencial Digital</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Login -->
    <section id="view-login" class="view active">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <span class="material-icons logo-icon">badge</span>
            <h1>Plataforma de Membresías</h1>
            <p>Credencialización digital y gestión de beneficios</p>
          </div>
          <form id="form-login">
            <div class="form-group">
              <label for="username">Usuario</label>
              <input type="text" id="username" placeholder="Ingrese su usuario" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input type="password" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password" />
            </div>
            <p id="login-error" class="error-msg hidden"></p>
            <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
          </form>
          <div class="login-demo">
            <p><strong>Usuarios de demo:</strong></p>
            <ul>
              <li><code>org / org123</code> → Organización</li>
              <li><code>miembro / miembro123</code> → Miembro</li>
              <li><code>proveedor / proveedor123</code> → Proveedor</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Shell de la app (después de login) -->
    <section id="view-app" class="view">
      <header class="app-header">
        <button id="btn-menu" class="icon-btn" aria-label="Menú">
          <span class="material-icons">menu</span>
        </button>
        <h2 id="header-title">Inicio</h2>
        <button id="btn-logout" class="icon-btn" aria-label="Cerrar sesión" title="Cerrar sesión">
          <span class="material-icons">logout</span>
        </button>
      </header>

      <nav id="side-nav" class="side-nav">
        <div class="nav-user">
          <span class="material-icons">account_circle</span>
          <div>
            <strong id="nav-user-name">Usuario</strong>
            <small id="nav-user-role">Rol</small>
          </div>
        </div>
        <ul id="nav-links"></ul>
      </nav>
      <div id="nav-overlay" class="nav-overlay"></div>

      <main id="main-content" class="main-content">
        <!-- El contenido se inyecta dinámicamente -->
      </main>
    </section>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button id="modal-close" class="icon-btn"><span class="material-icons">close</span></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views/org.js"></script>
  <script src="js/views/member.js"></script>
  <script src="js/views/provider.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
